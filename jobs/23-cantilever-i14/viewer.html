<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>static analysis of part - results viewer</title>
<style>
:root{--bg:#f4f5f7;--panel:#ffffff;--ink:#1c2330;--muted:#5b6678;--line:#d9dee6;--accent:#1f6feb;--canvas1:#e9edf3;--canvas2:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151c;--panel:#1a202a;--ink:#e6ebf2;--muted:#9aa6b8;--line:#2c3542;--accent:#6ea8ff;--canvas1:#141a23;--canvas2:#232c3a}}
:root[data-theme="dark"]{--bg:#11151c;--panel:#1a202a;--ink:#e6ebf2;--muted:#9aa6b8;--line:#2c3542;--accent:#6ea8ff;--canvas1:#141a23;--canvas2:#232c3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:13px}
header .sp{flex:1}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;display:flex;min-height:0}
#side{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 16px;overflow:auto}
#side h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
#side h2:first-child{margin-top:0}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
select,input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--ink);font-size:13px}
.chk input{width:auto;accent-color:var(--accent)}
#view{flex:1;position:relative;min-width:0;background:linear-gradient(var(--canvas2),var(--canvas1))}
canvas#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#gl:active{cursor:grabbing}
#legend{position:absolute;right:14px;top:14px;bottom:20px;width:150px;pointer-events:none;display:flex;flex-direction:column}
#legend .ttl{font-size:12px;font-weight:600;text-align:right;margin-bottom:14px;white-space:nowrap;text-shadow:0 0 4px var(--canvas2)}
#legend .bar{flex:1;display:flex;gap:6px;justify-content:flex-end;min-height:0}
#legend canvas{width:18px;height:100%;border:1px solid var(--line);border-radius:3px}
#legend .ticks{position:relative;width:66px;font-size:11.5px;font-variant-numeric:tabular-nums}
#legend .ticks span{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap;text-shadow:0 0 4px var(--canvas2)}
#readout{position:absolute;left:14px;bottom:12px;font-size:12.5px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:70%}
#frameLabel{position:absolute;left:14px;top:12px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
#triad{position:absolute;left:14px;bottom:56px;width:74px;height:74px;pointer-events:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12px;margin-top:12px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
@media (max-width:760px){main{flex-direction:column}#side{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:42vh}#legend{width:130px}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><span class="sub" id="subtitle"></span><span class="sp"></span>
  <button id="themeBtn" title="Switch light / dark">Theme</button>
</header>
<main>
  <aside id="side">
    <h2>Result</h2>
    <label for="field">Field</label><select id="field"></select>
    <label for="frame" id="frameLbl">Frame</label><select id="frame"></select>
    <div class="kv" style="margin-top:10px"><span>Minimum</span><span id="vmin"></span><span>Maximum</span><span id="vmax"></span></div>
    <h2>Deformation</h2>
    <label for="scale">Scale factor: <b id="scaleVal"></b></label>
    <input type="range" id="scale" min="0" max="1000" value="500">
    <div class="row" style="margin-top:6px"><button id="scale1">True scale (1x)</button><button id="scaleAuto">Auto</button></div>
    <div class="row" style="margin-top:10px"><button id="play">Animate</button></div>
    <label for="speed">Animation speed</label><input type="range" id="speed" min="1" max="100" value="40">
    <h2>Display</h2>
    <label class="chk"><input type="checkbox" id="edges" checked> Feature edges</label>
    <label class="chk"><input type="checkbox" id="mesh"> Element edges</label>
    <label class="chk"><input type="checkbox" id="ghost"> Undeformed outline</label>
    <label class="chk"><input type="checkbox" id="bands"> Banded colours (12 levels)</label>
    <label class="chk"><input type="checkbox" id="lockRange"> Same colour range for all frames</label>
    <div class="row" style="margin-top:8px"><button data-view="iso">Iso</button><button data-view="x">+X</button><button data-view="y">+Y</button><button data-view="z">+Z</button></div>
    <p class="hint">Drag to rotate, scroll to zoom, right-drag or Shift-drag to pan. Hover the model to read a value.</p>
    <h2>Model</h2>
    <div class="kv" id="modelInfo"></div>
  </aside>
  <section id="view">
    <canvas id="gl"></canvas>
    <div id="frameLabel"></div>
    <div id="legend"><div class="ttl" id="legTitle"></div><div class="bar"><canvas id="legBar" width="18" height="256"></canvas><div class="ticks" id="legTicks"></div></div></div>
    <canvas id="triad" width="148" height="148"></canvas>
    <div id="readout">Hover the model to read a value</div>
    <div id="err"></div>
  </section>
</main>

    if(DATA.transient && frames.length>1){ const f=Math.floor(((ts-S.t0)/1000*sp*4))%frames.length; if(f!==S.frame){ S.frame=f; $("frame").value=f; setFrame(); } S.phase=1; }
    else S.phase = DATA.mode_like ? Math.sin((ts-S.t0)/1000*sp*3.2) : 0.5-0.5*Math.cos((ts-S.t0)/1000*sp*2.4);
  } else S.phase=1;
  const m=mats(); gl.uniformMatrix4fv(U_.uMVP,false,m.mvp); gl.uniformMatrix4fv(U_.uMV,false,m.mv);
  gl.uniform2f(U_.uRange,range[0],range[1]); gl.uniform1f(U_.uBands,$("bands").checked?12:0);
  gl.uniform1f(U_.uScale,S.scale*S.phase); gl.uniform1i(U_.uMode,0);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1,1);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iTri); gl.drawElements(gl.TRIANGLES,tris.length,gl.UNSIGNED_INT,0);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  const c=ink(); gl.uniform1i(U_.uMode,1);
  if($("mesh").checked){ gl.uniform4f(U_.uColor,c[0],c[1],c[2],0.35); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iAll); gl.drawElements(gl.LINES,E.all.length,gl.UNSIGNED_INT,0); gl.disable(gl.BLEND); }
  if($("edges").checked){ gl.uniform4f(U_.uColor,c[0],c[1],c[2],1); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iFeat); gl.drawElements(gl.LINES,E.feat.length,gl.UNSIGNED_INT,0); }
  if($("ghost").checked){ gl.uniform1f(U_.uScale,0); gl.uniform4f(U_.uColor,c[0],c[1],c[2],0.45); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iFeat); gl.drawElements(gl.LINES,E.feat.length,gl.UNSIGNED_INT,0); gl.disable(gl.BLEND); }
  drawTriad();
  if(S.playing) requestDraw();
}
function drawTriad(){
  const c=$("triad"), g=c.getContext("2d"), R=viewRot(), o=74, L=46; g.clearRect(0,0,148,148);
  const ax=[["X","#e5484d",[1,0,0]],["Y","#30a46c",[0,1,0]],["Z","#3e63dd",[0,0,1]]].map(([n,col,v])=>({n,col,x:R[0]*v[0]+R[4]*v[1]+R[8]*v[2],y:R[1]*v[0]+R[5]*v[1]+R[9]*v[2],z:R[2]*v[0]+R[6]*v[1]+R[10]*v[2]})).sort((a,b)=>a.z-b.z);
  g.lineWidth=4; g.font="600 22px system-ui"; g.textAlign="center"; g.textBaseline="middle";
  for(const a of ax){ g.strokeStyle=a.col; g.fillStyle=a.col; g.beginPath(); g.moveTo(o,o); g.lineTo(o+a.x*L,o-a.y*L); g.stroke(); g.fillText(a.n,o+a.x*(L+16),o-a.y*(L+16)); }
}

// ---- interaction
let drag=null;
canvas.addEventListener("contextmenu",e=>e.preventDefault());
// touch: one finger rotates, two fingers pinch to zoom and drag to pan
const touches=new Map(); let pinch=null;
function pinchState(){ const p=[...touches.values()]; return {d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; }
canvas.addEventListener("pointerdown",e=>{ try{ canvas.setPointerCapture(e.pointerId); }catch(_){} touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){ drag=null; pinch=pinchState(); } else drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey}; });
function lift(e){ touches.delete(e.pointerId); pinch=null; drag=null; }
canvas.addEventListener("pointerup",lift); canvas.addEventListener("pointercancel",lift);
canvas.addEventListener("pointermove",e=>{
  if(touches.has(e.pointerId)) touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && touches.size===2){ const n=pinchState();
    if(n.d>1&&pinch.d>1){ S.dist*=pinch.d/n.d; S.dist=Math.max(size*0.05,Math.min(size*30,S.dist)); }
    const k=S.dist*0.0016; S.pan[0]+=(n.x-pinch.x)*k; S.pan[1]-=(n.y-pinch.y)*k; pinch=n; requestDraw(); return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(drag.pan){ const k=S.dist*0.0016; S.pan[0]+=dx*k; S.pan[1]-=dy*k; } else { S.rot[2]+=dx*0.008; S.rot[0]=Math.max(-Math.PI,Math.min(0,S.rot[0]+dy*0.008)); }
    requestDraw(); }
  else pick(e);
});
canvas.addEventListener("wheel",e=>{ e.preventDefault(); S.dist*=Math.exp(e.deltaY*0.0012); S.dist=Math.max(size*0.05,Math.min(size*30,S.dist)); requestDraw(); },{passive:false});
function pick(e){
  const r=canvas.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top, m=mats().mvp, sc=S.scale*S.phase;
  let best=-1, bd=18*18, bz=1e30;
  for(let i=0;i<nN;i++){ const x=nodes[3*i]+curDisp[3*i]*sc, y=nodes[3*i+1]+curDisp[3*i+1]*sc, z=nodes[3*i+2]+curDisp[3*i+2]*sc;
    const w=m[3]*x+m[7]*y+m[11]*z+m[15]; if(w<=0) continue;
    const sx=((m[0]*x+m[4]*y+m[8]*z+m[12])/w*0.5+0.5)*r.width, sy=(1-((m[1]*x+m[5]*y+m[9]*z+m[13])/w*0.5+0.5))*r.height;
    const d=(sx-px)*(sx-px)+(sy-py)*(sy-py); if(d<bd && w<bz*1.02){ if(d<bd*0.6||w<bz){ best=i; bd=d; bz=w; } } }
  $("readout").textContent = best<0 ? "Hover the model to read a value" :
    S.field+": "+fmt(curVal[best])+" "+(S.unit||"")+"   at ("+fmt(nodes[3*best])+", "+fmt(nodes[3*best+1])+", "+fmt(nodes[3*best+2])+") "+DATA.length_unit;
}
function fill(sel,items){ sel.innerHTML=""; items.forEach((t,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=t; sel.appendChild(o); }); }
fill($("field"),fieldNames); fill($("frame"),frames.map(f=>f.label));
$("frameLbl").textContent = DATA.mode_like?"Mode":(DATA.transient?"Time step":"Frame");
const prefer=["von Mises stress","Temperature","Mode shape (normalised)","Displacement"]; S.field=prefer.find(p=>fieldNames.includes(p))||fieldNames[0]; $("field").value=fieldNames.indexOf(S.field);
if(DATA.transient) { S.frame=frames.length-1; $("frame").value=S.frame; $("lockRange").checked=true; }
$("field").onchange=e=>{ S.field=fieldNames[+e.target.value]; setField(); };
$("frame").onchange=e=>{ S.frame=+e.target.value; setFrame(); if(!DATA.transient) setScale(autoScale()); };
$("scale").oninput=e=>setScale(sliderToScale(+e.target.value));
$("scale1").onclick=()=>setScale(maxDisp>0?1:0); $("scaleAuto").onclick=()=>setScale(autoScale());
$("play").onclick=()=>{ S.playing=!S.playing; S.t0=performance.now(); $("play").classList.toggle("on",S.playing); $("play").textContent=S.playing?"Stop":"Animate"; requestDraw(); };
for(const id of ["edges","mesh","ghost"]) $(id).onchange=requestDraw;
$("bands").onchange=()=>{ drawLegend(); requestDraw(); }; $("lockRange").onchange=setField;
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ const v=b.dataset.view; S.pan=[0,0];
  S.rot = v==="iso"?[-1.05,0,0.6] : v==="x"?[-Math.PI/2,0,-Math.PI/2] : v==="y"?[-Math.PI/2,0,Math.PI] : [0,0,0]; requestDraw(); });
const info=$("modelInfo"); [["Surface nodes",nN.toLocaleString()],["Surface triangles",(tris.length/3).toLocaleString()],["Size",fmt(DATA.size)+" "+DATA.length_unit],["Frames",frames.length]].forEach(([k,v])=>{ const a=document.createElement("span"), b=document.createElement("span"); a.textContent=k; b.textContent=v; info.append(a,b); });
window.addEventListener("resize",requestDraw);
setFrame(); setScale(autoScale());
window.__viewer={S,setScale,requestDraw,frames,setFrame};
})();
</script>
