name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install solver and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq calculix-ccx libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          .venv/bin/python -m pip install -q -e ".[mcp,dev]"
      - name: Environment check
        run: .venv/bin/engagent doctor --full
      - name: Unit tests
        run: .venv/bin/python -m pytest -q
      - name: Solver benchmarks
        run: .venv/bin/python -m pytest -q -m solver

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($f.Name): $_" } }
          }
          if ($bad) { exit 1 }
      - name: Windows setup (as a user would run it)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup.ps1 -NoShortcut
      - name: Windows menu actions (START-HERE, non-interactive)
        shell: powershell
        run: |
          "ea make standoff --print petg --no-report" | Set-Content ci-request.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -Do request -File ci-request.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -Do units
          $u = (& .venv\Scripts\engagent.exe units --json | ConvertFrom-Json).units
          if ($u -ne "imperial") { Write-Host "units toggle failed: $u"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -Do units
          $t = (powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -Do prompt) -join "`n"
          if ($t -notmatch "TEMPLATES") { Write-Host "prompt not printed"; exit 1 }
          "ea make standoff --no-report" | Set-Content -Encoding UTF8 ci-bom.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -Do request -File ci-bom.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: One-line commands on Windows
        shell: cmd
        run: |
          call .\ea.cmd make enclosure --print petg --no-report || exit /b 1
          call .\ea.cmd analyze beam -m steel_generic --fix xmin --force xmax 0,0,-100 --quick --check "beam.cantilever_end_load P=100 L=100 E=210GPa b=10 h=10 nu=0.3" || exit /b 1
