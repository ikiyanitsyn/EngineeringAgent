# Engineering requests from GitHub issues: write what you need in plain English (or paste
# a chatbot reply / `ea` commands); this workflow runs the CAD/FEA toolchain on GitHub's
# free runners and replies with results, files and a report. Works from the GitHub app.
# Only the repository owner and collaborators can trigger it.
name: engineer

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request:
        description: "What do you need? Plain English, `ea` command lines, or a chatbot reply"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: engineer
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        (startsWith(github.event.issue.title, 'Request') || contains(github.event.issue.labels.*.name, 'request'))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.issue.title, 'Request') || contains(github.event.issue.labels.*.name, 'request')))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install solver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq calculix-ccx libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
      - name: Install EngineeringAgent
        run: python -m pip install -q -e .
      - name: Does this request need the AI model?
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGAGENT_LLM_KEY: ${{ secrets.ENGAGENT_LLM_KEY }}
        run: python scripts/issue_bot.py --needs-model || echo "needs=true" >> "$GITHUB_OUTPUT"
      - name: Restore the cached open model (used when no hosted model is available)
        if: steps.decide.outputs.needs != 'false'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-v1-${{ vars.ENGAGENT_LOCAL_MODEL || 'qwen2.5-coder-7b' }}
      - name: Run the request
        id: bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: use another free model provider for plain-English requests (see docs/USER-GUIDE.md):
          # repository secret ENGAGENT_LLM_KEY, variables ENGAGENT_LLM_URL and ENGAGENT_LLM_MODEL.
          ENGAGENT_LLM_KEY: ${{ secrets.ENGAGENT_LLM_KEY }}
          ENGAGENT_LLM_URL: ${{ vars.ENGAGENT_LLM_URL }}
          ENGAGENT_LLM_MODEL: ${{ vars.ENGAGENT_LLM_MODEL }}
          ENGAGENT_LOCAL_MODEL: ${{ vars.ENGAGENT_LOCAL_MODEL }}
        run: python scripts/issue_bot.py
      - name: Upload files (STEP, STL, reports, interactive viewer)
        if: always() && steps.bot.outputs.folders != 'jobs/.none'
        uses: actions/upload-artifact@v4
        with:
          name: engineering-results-${{ github.run_id }}
          path: ${{ steps.bot.outputs.folders }}
          if-no-files-found: ignore
