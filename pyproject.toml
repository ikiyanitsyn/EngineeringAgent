[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engagent"
version = "0.1.0"
description = "CAD + FEA engineering agent toolkit: build123d, Gmsh, CalculiX, hand calcs, GD&T, reports"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "build123d>=0.9",
    "gmsh>=4.11",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
engagent = "engagent.cli:main"
engagent-mcp = "engagent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["engagent*"]

[tool.setuptools.package-data]
engagent = ["viewer/*.html", "viewer/*.js", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["solver: needs the CalculiX solver and Gmsh (slow)"]
